version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aws_copilot_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=aws_academy_copilot

  backend:
    build: ./backend
    container_name: aws_copilot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=aws_academy_copilot
      - LLM_PROVIDER=local_mock
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aws_copilot_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
